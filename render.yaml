# Render blueprint — https://render.com
#
# Deploys the whole system as ONE web service: the Node API also serves the built
# React app, so there is no separate frontend host and no CORS/cookie setup needed.
#
# NOTE ON THE DATABASE: Render's free plan has no persistent disk, so the SQLite
# file is recreated on every deploy/restart. That is fine for a demo — the server
# auto-seeds 16 users, 5 doctors, 330 slots and 10 appointments whenever the
# database is empty, so the app always comes up fully populated.
services:
  - type: web
    name: careconnect
    runtime: node
    plan: free

    # node:sqlite (used instead of MySQL) requires Node >= 22.5
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      # Render reaches containers over 0.0.0.0 — 127.0.0.1 is unreachable there.
      - key: HOST
        value: 0.0.0.0
      # Generated once by Render and stored as a secret; the app refuses to start
      # in production with the built-in development key.
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/backend/data/appointments.db

    # Build the React app first, then install API dependencies.
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start

    healthCheckPath: /api/v1/health
